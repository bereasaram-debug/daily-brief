name: Kakao send

on:
  push:
    branches: [main]
    paths:
      - "reports/*.kakao.txt"
  workflow_dispatch:
    inputs:
      date:
        description: "발송할 브리핑 날짜(YYYY-MM-DD). 비워 두면 테스트 메시지를 보냅니다."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: kakao-send
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 보낼 요약 파일 찾기
        id: find
        env:
          EVENT: ${{ github.event_name }}
          INPUT_DATE: ${{ github.event.inputs.date }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repo="${GITHUB_REPOSITORY#*/}"
          base="https://${owner}.github.io/${repo}"
          file=""
          if [ "$EVENT" = "workflow_dispatch" ]; then
            if [ -n "$INPUT_DATE" ]; then
              file="reports/${INPUT_DATE}.kakao.txt"
              [ -f "$file" ] || { echo "::error::$file 파일이 없습니다."; exit 1; }
            fi
          else
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              list=$(git log -1 --name-only --diff-filter=AM --format= "$AFTER" -- 'reports/*.kakao.txt')
            else
              list=$(git diff --name-only --diff-filter=AM "$BEFORE" "$AFTER" -- 'reports/*.kakao.txt')
            fi
            file=$(echo "$list" | grep -E '^reports/[0-9]{4}-[0-9]{2}-[0-9]{2}\.kakao\.txt$' | sort | tail -n 1 || true)
            if [ -z "$file" ]; then
              echo "추가·수정된 요약 파일이 없어(삭제만 있음) 발송하지 않습니다."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          if [ -n "$file" ]; then
            date=$(basename "$file" .kakao.txt)
            page="${base}/reports/${date}.html"
          else
            page="${base}/"
          fi
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "page=$page" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "요약 파일: ${file:-(테스트 메시지)}"
          echo "웹페이지: $page"

      - name: 웹페이지 게시 대기 (최대 10분)
        if: steps.find.outputs.skip != 'true'
        env:
          PAGE: ${{ steps.find.outputs.page }}
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -L "$PAGE?nocache=$(date +%s)" || echo 000)
            if [ "$code" = "200" ]; then
              echo "웹페이지 확인 완료 (HTTP 200)"
              exit 0
            fi
            echo "대기 중... ($i/60, HTTP $code)"
            sleep 10
          done
          echo "::warning::10분 안에 웹페이지가 열리지 않았지만 카톡은 발송합니다: $PAGE"

      - name: 카카오톡 발송
        id: send
        if: steps.find.outputs.skip != 'true'
        env:
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          SUMMARY_FILE: ${{ steps.find.outputs.file }}
          PAGE_URL: ${{ steps.find.outputs.page }}
        run: python3 scripts/kakao_send.py

      - name: 갱신된 토큰 암호문 커밋
        if: always() && steps.send.outputs.token_updated == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kakao_token.enc
          git commit -m "chore: 카카오 토큰 암호문 갱신 [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          echo "::error::kakao_token.enc 커밋 실패"
          exit 1
